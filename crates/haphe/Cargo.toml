[package]
name = "haphe"
version = "0.1.0"
edition = "2024"
description = "Generator for script engine bindings efficiently and generically"
license = "Apache-2.0"

[dependencies]
haphe-core = { path = "../haphe-core" }
haphe-macros = { path = "../haphe-macros", optional = true }

[features]
default = ["macros"]
macros = ["dep:haphe-macros"]
# Expose bitflags-crate types as flags enums via `haphe::script_bitflags!`.
bitflags = ["haphe-core/bitflags"]
# First-class `haphe::Stream<T>` value type.
streams = ["haphe-core/streams"]
# First-class `haphe::Future<T>` value type.
futures = ["haphe-core/futures"]
# Bridge conversions for `chrono` timestamp types.
chrono = ["haphe-core/chrono"]
# Bridge conversions for `jiff` timestamp types.
jiff = ["haphe-core/jiff"]

[dev-dependencies]
trybuild = "1"

[lints]
workspace = true
