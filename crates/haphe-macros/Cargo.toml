[package]
name = "haphe-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for the haphe scripting-language binding generator"
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit", "visit-mut"] }

[dev-dependencies]
haphe = { path = "../haphe" }
