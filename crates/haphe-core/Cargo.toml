[package]
name = "haphe-core"
version = "0.1.0"
edition = "2024"
description = "Core IR and traits for haphe scripting-language binding generator"
license = "Apache-2.0"

[features]
# Expose bitflags-crate types as flags enums via `script_bitflags!`.
bitflags = ["dep:bitflags"]
# First-class `Stream<T>` value type.
streams = ["dep:futures-core"]
# First-class `Future<T>` value type (dependency-free).
futures = []
# Bridge conversions for `chrono` timestamp types.
chrono = ["dep:chrono"]
# Bridge conversions for `jiff` timestamp types.
jiff = ["dep:jiff"]

[dependencies]
bitflags = { version = "2", optional = true }
futures-core = { version = "0.3", optional = true, default-features = false }
chrono = { version = "0.4", optional = true, default-features = false }
jiff = { version = "0.2", optional = true, default-features = false }

[lints]
workspace = true
